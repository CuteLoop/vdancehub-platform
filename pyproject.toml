[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vdancehub-platform"
version = "0.1.0"
description = "A collaborative dance commons for discussion, feedback, mentoring, and shared knowledge."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "Django>=5.2,<6.2",
  "django-allauth>=65,<66",
  "django-csp>=4,<5",
  "django-htmx>=1.21,<2",
  "django-redis>=5.4,<8",
  "dj-database-url>=2.3,<4",
  "gunicorn>=23,<27",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<9",
  "whitenoise>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "django-stubs>=5.1,<7",
  "mypy>=1.13,<3",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-django>=4.9,<5",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.8,<1",
]
[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "DJ", "UP"]
ignore = ["DJ008"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
exclude = ["migrations"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

