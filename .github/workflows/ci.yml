name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vdancehub
          POSTGRES_PASSWORD: vdancehub
          POSTGRES_DB: vdancehub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vdancehub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vdancehub:vdancehub@localhost:5432/vdancehub
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy apps config
      - run: python manage.py makemigrations --check --dry-run
      - run: coverage run -m pytest
      - run: coverage report
      - run: python manage.py check --deploy --settings=config.settings.production
        env:
          DJANGO_SECRET_KEY: ci-only-not-real-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEF
          ALLOWED_HOSTS: example.com
          REDIS_URL: redis://localhost:6379/0
      - run: pip-audit

