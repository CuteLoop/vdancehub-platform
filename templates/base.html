{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}VDanceHub{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
  </head>
  <body>
    <header>
      <nav>
        <a href="/"><strong>VDanceHub</strong></a>
        <a href="{% url 'discussions:list' %}?style=bachata&amp;tag=move">Discuss</a>
        <a href="{% url 'feedback:create' %}">Get feedback</a>
        {% if user.is_authenticated %}
          <span>{{ user.display_name }}</span>
          <a href="{% url 'account_logout' %}">Log out</a>
        {% else %}
          <a href="{% url 'account_login' %}">Log in</a>
          <a href="{% url 'account_signup' %}">Sign up</a>
        {% endif %}
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer><small>Pre-alpha · Adults 18+ · External links and services are not verified.</small></footer>
  </body>
</html>
